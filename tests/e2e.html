<!doctype html><meta charset="utf-8"><title>v6 e2e</title><pre id="out">running</pre>
<style>iframe{border:0;position:absolute;left:-9999px;top:0}</style>
<script>
const out = []; let fails = 0;
const ok = (c, m) => { if (!c) fails++; out.push((c ? 'PASS ' : 'FAIL ') + m); };
const wait = ms => new Promise(r => setTimeout(r, ms));
function load(hash = '', w = 1280) {
  return new Promise(res => { const f = document.createElement('iframe'); f.style.width = w + 'px'; f.style.height = '900px'; f.src = '../index.html' + hash; f.onload = () => setTimeout(() => res(f), 700); document.body.appendChild(f); });
}
const names = d => [...d.querySelectorAll('.card .c-name')].map(e => e.textContent.trim());
(async () => {
  const kpis = await fetch('../data/kpis.json').then(r => r.json());
  let f = await load(), d = f.contentDocument, w = f.contentWindow;
  ok(d.querySelectorAll('.card').length === 18, '18 cards on the overview');
  ok(JSON.stringify(names(d).sort()) === JSON.stringify(kpis.map(k => k.name).sort()), 'card names match the Excel names exactly');
  ok(d.querySelectorAll('.domain').length === 7, '7 domain sections');
  const dsel = d.getElementById('domain'), osel = d.getElementById('owner');
  ok([...dsel.options].length === 8, 'domain drop-down: all + 7');
  ok([...osel.options].map(o => o.text).slice(1).every(t => kpis.some(k => k.owner === t)) && osel.options.length === 13, 'owner drop-down: all + 12 Excel owners');
  // every domain shows all its KPIs, and nothing else
  for (const dom of new Set(kpis.map(k => k.domain))) {
    dsel.value = dom; dsel.dispatchEvent(new w.Event('change')); await wait(100);
    const exp = kpis.filter(k => k.domain === dom).map(k => k.name).sort();
    ok(JSON.stringify(names(d).sort()) === JSON.stringify(exp), `domain "${dom}" shows exactly its ${exp.length} KPIs`);
  }
  dsel.value = ''; dsel.dispatchEvent(new w.Event('change'));
  for (const own of new Set(kpis.map(k => k.owner))) {
    osel.value = own; osel.dispatchEvent(new w.Event('change')); await wait(100);
    const exp = kpis.filter(k => k.owner === own).map(k => k.name).sort();
    ok(JSON.stringify(names(d).sort()) === JSON.stringify(exp), `owner "${own}" shows exactly its KPIs`);
  }
  // cascading: choose CISO, domains offered must shrink
  osel.value = 'CISO'; osel.dispatchEvent(new w.Event('change')); await wait(100);
  ok(d.getElementById('domain').options.length === 2 && d.getElementById('domain').options[1].text === 'Security & Risk', 'owner CISO limits domains to Security & Risk');
  osel.value = ''; osel.dispatchEvent(new w.Event('change')); await wait(100);
  // open, tabs, escape, focus return
  const card = d.querySelector('[data-kpi="application-portfolio-time"]'); card.focus(); card.click(); await wait(150);
  const dlg = d.getElementById('detail');
  ok(dlg.open, 'clicking a card opens the detail panel');
  ok(w.location.hash.includes('kpi=application-portfolio-time'), 'hash records the open KPI');
  const tabs = [...d.querySelectorAll('[data-tabset]')];
  ok(tabs.length === 4, 'TIME has 4 category tabs');
  tabs[3].click(); await wait(50);
  const panel = [...d.querySelectorAll('[role="tabpanel"]')].find(p => !p.hidden);
  ok(panel && panel.querySelectorAll('tbody tr').length === 5, 'Eliminate tab lists the 5 applications to retire');
  tabs[3].focus(); tabs[3].dispatchEvent(new w.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true })); await wait(50);
  ok(d.querySelector('[data-tabset].on') === tabs[0], 'arrow key wraps to the first tab');
  await new Promise(r => { dlg.addEventListener('close', () => setTimeout(r, 50), { once: true }); dlg.close(); });
  ok(!dlg.open && d.activeElement === card, 'closing returns focus to the card');
  ok(!w.location.hash.includes('kpi='), 'hash cleared on close');
  // contract renewals
  d.querySelector('[data-kpi="contract-renewals-due-6-12-months"]').click(); await wait(150);
  ok(d.querySelector('#detail-body .d-val').textContent === '23' && d.querySelectorAll('#detail-body tbody tr').length >= 8, 'contract renewals: count then renewal list');
  f.remove();
  // deep link
  f = await load('#domain=Financial&kpi=cloud-spend-and-waste'); d = f.contentDocument;
  ok(d.getElementById('detail').open && d.querySelectorAll('.card').length === 4, 'deep link opens KPI with domain filter');
  f.remove();
  f = await load('#kpi=nonsense'); d = f.contentDocument;
  ok(!d.getElementById('detail').open && d.querySelectorAll('.card').length === 18, 'unknown KPI in link is ignored');
  f.remove();
  out.push(fails ? `FAILED ${fails}` : 'ALL PASSED');
  document.getElementById('out').textContent = out.join('\n');
})().catch(e => { document.getElementById('out').textContent = out.join('\n') + '\nERROR ' + e.message; });
</script>
